<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ontario's Favourite Small Towns</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    #map { width: 100%; height: 100%; }

    /* Search */
    .search-box {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: #fff; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      width: 260px; overflow: hidden;
      transition: background .3s, box-shadow .3s;
    }
    .search-box input {
      width: 100%; padding: 10px 14px; border: none; outline: none;
      font-size: 14px; background: transparent; color: inherit;
    }
    .search-results {
      max-height: 240px; overflow-y: auto; border-top: 1px solid #eee;
      display: none;
    }
    .search-results.active { display: block; }
    .search-result {
      padding: 8px 14px; cursor: pointer; font-size: 13px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .search-result:hover { background: #f5f5f5; }
    .search-result .mentions { color: #888; font-size: 11px; }

    /* Legend */
    .legend {
      position: absolute; bottom: 28px; left: 12px; z-index: 1000;
      background: #fff; border-radius: 8px; padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      font-size: 12px; line-height: 1.6;
      transition: background .3s, color .3s, box-shadow .3s;
    }
    .legend h4 { margin-bottom: 6px; font-size: 13px; color: #333; }
    .legend-item {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none; border-radius: 4px;
      padding: 2px 4px; margin: 0 -4px;
      transition: opacity .2s;
    }
    .legend-item:hover { background: rgba(0,0,0,.04); }
    .legend-item.off { opacity: .3; }
    .legend-dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
      transition: transform .15s;
    }
    .legend-item.off .legend-dot { transform: scale(.6); }

    /* Dark mode toggle */
    .dark-toggle {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      background: #fff; border: none; border-radius: 8px;
      width: 40px; height: 40px; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      transition: background .3s, box-shadow .3s;
    }
    .dark-toggle:hover { background: #f0f0f0; }

    /* Header */
    .header {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(255,255,255,.92); backdrop-filter: blur(6px);
      padding: 6px 16px; text-align: center;
      font-size: 13px; color: #444;
      border-top: 1px solid rgba(0,0,0,.08);
      transition: background .3s, color .3s;
    }
    .header a { color: #e25822; text-decoration: none; }
    .header a:hover { text-decoration: underline; }

    /* Share toast */
    .share-toast {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; padding: 8px 18px; border-radius: 8px;
      font-size: 13px; z-index: 2000; opacity: 0;
      transition: opacity .3s; pointer-events: none;
    }
    .share-toast.show { opacity: 1; }

    /* Popup */
    .leaflet-popup-content-wrapper {
      border-radius: 10px !important;
      box-shadow: 0 4px 16px rgba(0,0,0,.15) !important;
    }
    .leaflet-popup-content { margin: 14px 16px !important; font-size: 13px; line-height: 1.5; }
    .popup-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: #222; }
    .popup-stats { display: flex; gap: 16px; margin-bottom: 8px; color: #555; }
    .popup-stat-label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: .5px; }
    .popup-stat-value { font-size: 15px; font-weight: 600; }
    .popup-actions { display: flex; gap: 12px; align-items: center; margin-top: 6px; }
    .popup-link, .popup-share {
      display: inline-block;
      color: #e25822; text-decoration: none; font-size: 12px; font-weight: 500;
      cursor: pointer; background: none; border: none; padding: 0;
      font-family: inherit;
    }
    .popup-link:hover, .popup-share:hover { text-decoration: underline; }
    .popup-share { color: #888; }

    /* ── Dark mode ── */
    body.dark #map { background: #1a1a2e; }
    body.dark .search-box { background: #23233a; box-shadow: 0 2px 8px rgba(0,0,0,.5); color: #e0e0e0; }
    body.dark .search-box input { color: #e0e0e0; }
    body.dark .search-box input::placeholder { color: #888; }
    body.dark .search-results { border-top-color: #333; }
    body.dark .search-result:hover { background: #2a2a45; }
    body.dark .search-result .mentions { color: #777; }
    body.dark .legend { background: #23233a; color: #ccc; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
    body.dark .legend h4 { color: #ddd; }
    body.dark .dark-toggle { background: #23233a; color: #eee; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
    body.dark .dark-toggle:hover { background: #2e2e4a; }
    body.dark .header { background: rgba(26,26,46,.92); color: #aaa; border-top-color: rgba(255,255,255,.08); }
    body.dark .leaflet-popup-content-wrapper { background: #23233a !important; color: #ddd !important; }
    body.dark .leaflet-popup-tip { background: #23233a !important; }
    body.dark .popup-title { color: #eee; }
    body.dark .popup-stats { color: #aaa; }
    body.dark .popup-stat-label { color: #777; }
    body.dark .popup-share { color: #777; }
    body.dark .share-toast { background: #555; }
    body.dark .legend-item:hover { background: rgba(255,255,255,.06); }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .search-box { width: calc(100% - 64px); right: 8px; }
      .dark-toggle { top: 8px; left: 8px; }
      .legend {
        bottom: auto; top: 60px; left: 8px;
        padding: 10px 12px; font-size: 11px;
      }
      .legend h4 { font-size: 12px; }
      .legend-item { padding: 4px 6px; min-height: 32px; }
      .header { font-size: 11px; padding: 5px 12px; }
      .popup-title { font-size: 15px; }
      .popup-stat-value { font-size: 14px; }
      .leaflet-popup-content { margin: 10px 12px !important; }
    }
  </style>
</head>
<body>

<div id="map"></div>

<button class="dark-toggle" id="darkToggle" title="Toggle dark mode">🌙</button>

<div class="search-box">
  <input type="text" id="search" placeholder="Search towns…" autocomplete="off">
  <div class="search-results" id="results"></div>
</div>

<div class="legend">
  <h4>Mentions in thread</h4>
  <div class="legend-item" data-tier="1"><span class="legend-dot" style="background:#febd2a; width:6px; height:6px;"></span> 1</div>
  <div class="legend-item" data-tier="2"><span class="legend-dot" style="background:#e97158; width:8px; height:8px;"></span> 2–4</div>
  <div class="legend-item" data-tier="3"><span class="legend-dot" style="background:#a31e9a; width:11px; height:11px;"></span> 5–9</div>
  <div class="legend-item" data-tier="4"><span class="legend-dot" style="background:#0d0887; width:14px; height:14px;"></span> 10+</div>
</div>

<div class="header">
  Your favourite small towns from
  <a href="https://www.reddit.com/r/ontario/comments/14ci5my/your_favourite_small_towns/" target="_blank" rel="noopener">r/ontario</a>
</div>

<div class="share-toast" id="shareToast">Link copied!</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  // ── Tile layers ──
  const lightTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 18
  });
  const darkTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    maxZoom: 18
  });

  // ── Map setup ──
  const map = L.map('map', { zoomControl: false }).setView([44.5, -79.5], 6);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  let isDark = false;
  lightTile.addTo(map);

  // ── Tier helpers ──
  function tier(m) {
    if (m >= 10) return 4;
    if (m >= 5)  return 3;
    if (m >= 2)  return 2;
    return 1;
  }

  const activeTiers = new Set([1, 2, 3, 4]);

  // ── Color & radius (original Plasma scale) ──
  const colorScale = [
    '#febd2a', '#fba238', '#f48849', '#e97158',
    '#db5c68', '#cc4778', '#b83289', '#a31e9a',
    '#8b0aa5', '#6f00a8', '#5302a3', '#350498', '#0d0887'
  ];
  function style(m) {
    const i = Math.min(m - 1, colorScale.length - 1);
    const r = Math.min(1 + m * 0.25, 7);
    return { color: colorScale[i], radius: r };
  }

  function formatPop(n) {
    if (!n) return '—';
    return n.toLocaleString('en-CA');
  }

  // ── Slug helper for URL hash ──
  function toSlug(name) {
    return encodeURIComponent(name.replace(/\s+/g, '-'));
  }
  function fromSlug(slug) {
    return decodeURIComponent(slug).replace(/-/g, ' ').toLowerCase();
  }

  // ── Share toast ──
  function showToast() {
    const toast = document.getElementById('shareToast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function popupHTML(t) {
    const shareURL = location.origin + location.pathname + '#' + toSlug(t.city);
    return '<div class="popup-title">' + t.city + '</div>' +
      '<div class="popup-stats">' +
        '<div><div class="popup-stat-label">Mentions</div><div class="popup-stat-value">' + t.mentions + '</div></div>' +
        '<div><div class="popup-stat-label">Population</div><div class="popup-stat-value">' + formatPop(t.population) + '</div></div>' +
      '</div>' +
      '<div class="popup-actions">' +
        '<a class="popup-link" href="' + t.url + '" target="_blank" rel="noopener">Google Maps ↗</a>' +
        '<button class="popup-share" onclick="navigator.clipboard.writeText(\'' + shareURL + '\').then(function(){document.getElementById(\'shareToast\').classList.add(\'show\');setTimeout(function(){document.getElementById(\'shareToast\').classList.remove(\'show\')},1800)})">Share link</button>' +
      '</div>';
  }

  // ── Load data ──
  const markers = [];

  fetch('towns.json')
    .then(r => r.json())
    .then(towns => {
      towns.forEach(t => {
        const s = style(t.mentions);
        const marker = L.circleMarker([t.lat, t.lon], {
          radius: s.radius,
          color: s.color,
          fillColor: s.color,
          fillOpacity: 0.85,
          weight: 1.5,
          opacity: 1
        });

        marker.bindPopup(popupHTML(t), { maxWidth: 240, closeButton: true });
        marker.bindTooltip(t.city, { direction: 'top', offset: [0, -s.radius] });

        // Update hash when popup opens
        marker.on('popupopen', () => {
          history.replaceState(null, '', '#' + toSlug(t.city));
        });

        marker.addTo(map);
        markers.push({ marker, town: t });
      });

      initFilter();
      initSearch(towns);
      handleHash(towns);

      // Listen for hash changes (browser back/forward)
      window.addEventListener('hashchange', () => handleHash(towns));
    });

  // ── Open town from URL hash ──
  function handleHash(towns) {
    const hash = location.hash.slice(1);
    if (!hash) return;
    const slug = fromSlug(hash);
    const entry = markers.find(m => m.town.city.toLowerCase() === slug);
    if (entry) {
      map.setView([entry.town.lat, entry.town.lon], 12);
      entry.marker.openPopup();
    }
  }

  // ── Legend filter ──
  function rebuildMarkers() {
    markers.forEach(({ marker, town }) => {
      if (activeTiers.has(tier(town.mentions))) {
        if (!map.hasLayer(marker)) marker.addTo(map);
      } else {
        map.removeLayer(marker);
      }
    });
  }

  function initFilter() {
    document.querySelectorAll('.legend-item[data-tier]').forEach(el => {
      el.addEventListener('click', () => {
        const t = Number(el.dataset.tier);
        if (activeTiers.has(t)) {
          if (activeTiers.size === 1) return; // keep at least one active
          activeTiers.delete(t);
          el.classList.add('off');
        } else {
          activeTiers.add(t);
          el.classList.remove('off');
        }
        rebuildMarkers();
      });
    });
  }

  // ── Dark mode ──
  const toggle = document.getElementById('darkToggle');
  toggle.addEventListener('click', () => {
    isDark = !isDark;
    document.body.classList.toggle('dark', isDark);
    if (isDark) {
      map.removeLayer(lightTile);
      darkTile.addTo(map);
      toggle.textContent = '☀️';
    } else {
      map.removeLayer(darkTile);
      lightTile.addTo(map);
      toggle.textContent = '🌙';
    }
  });

  // ── Search ──
  function initSearch(towns) {
    const input = document.getElementById('search');
    const results = document.getElementById('results');

    input.addEventListener('input', function () {
      const q = this.value.trim().toLowerCase();
      results.innerHTML = '';
      if (q.length < 1) { results.classList.remove('active'); return; }

      const matches = towns
        .filter(t => t.city.toLowerCase().includes(q))
        .slice(0, 10);

      if (matches.length === 0) {
        results.classList.remove('active');
        return;
      }

      matches.forEach(t => {
        const div = document.createElement('div');
        div.className = 'search-result';
        div.innerHTML = '<span>' + t.city + '</span><span class="mentions">' + t.mentions + ' mention' + (t.mentions !== 1 ? 's' : '') + '</span>';
        div.addEventListener('click', () => {
          map.setView([t.lat, t.lon], 12);
          const entry = markers.find(m => m.town === t);
          if (entry) entry.marker.openPopup();
          input.value = t.city;
          results.classList.remove('active');
        });
        results.appendChild(div);
      });
      results.classList.add('active');
    });

    input.addEventListener('blur', () => {
      setTimeout(() => results.classList.remove('active'), 200);
    });
    input.addEventListener('focus', () => {
      if (input.value.trim().length > 0) input.dispatchEvent(new Event('input'));
    });
  }
})();
</script>
</body>
</html>
